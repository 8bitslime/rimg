[package]
name = "rimg"
version = "0.1.0"
edition = "2024"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "tga", "pnm", "qoi", "hdr", "exr", "dds", "ff", "avif-native"] }
jxl-oxide = "0.12.6"
libheif-rs = "3.0.0"
softbuffer = "0.4.8"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "metal", "dx12", "gles"] }
winit = "0.30.13"
